schema_version: 1
# Null review fields are intentional: these references have not been admitted as source code.
# Before copying: pin a commit, verify its license, record review date and attribution.
default_policy:
  usage: architecture-and-behavior-reference-only
  copy_code: false
  review_required_before_copy: true
references:
